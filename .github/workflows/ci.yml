name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run --filter app check
      - run: bun run --filter app build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium firefox webkit
        working-directory: packages/app
      - run: bunx playwright test
        working-directory: packages/app
      - name: Offline e2e against the production build
        working-directory: packages/app
        run: |
          bun run build
          (bun run preview -- --port 4174 --strictPort &) && sleep 3
          E2E_BASE_URL=http://localhost:4174 bunx playwright test offline
